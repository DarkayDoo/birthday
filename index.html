:root{
  --table:#EAF0F5; --paper:#FFFFFF; --letter:#F4F7FA; --ink:#1F2733; --muted:#56606C;
  --red:#A9181F; --chev-red:#B8323A; --chev-blue:#24487A; --photo-ph:#E3E9EF;
  --grain:url(assets/paper-grain.svg);
  --shadow-paper:0 1px 1px rgba(30,45,70,.06),0 16px 34px rgba(30,45,70,.15);
  --shadow-paper-deep:0 2px 2px rgba(30,45,70,.07),0 22px 46px rgba(30,45,70,.19);
  --shadow-polaroid:0 1px 2px rgba(0,0,0,.08),0 14px 28px rgba(30,45,70,.16);
  --chevron:repeating-linear-gradient(135deg,#B8323A 0 9px,#FFF 9px 14px,#24487A 14px 23px,#FFF 23px 28px);
  --tape:repeating-linear-gradient(135deg,#B8323A 0 7px,#FFF 7px 11px,#24487A 11px 18px,#FFF 18px 22px);
  --ease:cubic-bezier(.2,.8,.2,1);
  --k:1; --s:1;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--table)}
html.locked,html.locked body{overflow:hidden}
body{
  min-height:100vh;min-height:100svh;
  font-family:"Libre Baskerville",Georgia,serif;color:var(--ink);
  -webkit-text-size-adjust:100%;text-size-adjust:100%;
  -webkit-font-smoothing:antialiased;
}
img{display:block}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- 6.1 Sealed ---------- */
.scene{position:fixed;inset:0;z-index:5}
.card-pos{
  --cw:min(316px,calc(100vw - 44px));
  position:absolute;left:50%;top:42%;
  width:var(--cw);height:calc(var(--cw) * 204 / 316);
  transform:translate(-50%,-50%);
}
@media (min-width:900px){.card-pos{--cw:520px}}
.js .card-drop{opacity:0}
.card-drop{width:100%;height:100%}
.card-tilt{width:100%;height:100%;transform:rotate(-1deg)}
.card{
  position:absolute;left:0;top:0;width:316px;height:204px;
  transform-origin:0 0;transform:scale(var(--k));
  background:var(--chevron);box-shadow:var(--shadow-paper);
}
.card .in{position:absolute;inset:7px;background:var(--paper) var(--grain);overflow:hidden}
.card .in > *{position:absolute}
.label{
  left:12px;top:12px;width:92px;padding:5px 0 4px;background:var(--chev-blue);color:#fff;text-align:center;line-height:1.15;
}
.label p:first-child{font-size:10px;letter-spacing:.16em;text-indent:.16em}
.label p + p{margin-top:2px;font-size:8px;letter-spacing:.1em;text-indent:.1em}
.stamp{width:60px;height:auto;filter:drop-shadow(0 1px 1px rgba(0,0,0,.12))}
.stamp-praha{right:74px;top:10px;transform:rotate(-2deg)}
.stamp-london{right:8px;top:8px;transform:rotate(1.5deg)}
.pm-london{left:148px;top:2px;width:140px;height:auto;transform:rotate(-4deg)}
.pm-praha{right:4px;top:52px;width:52px;height:auto;transform:rotate(-10deg)}
.to-name{left:18px;top:70px;font-size:21px;font-style:italic;line-height:1.25;white-space:nowrap;color:var(--ink)}
.to-city{left:19px;top:100px;font-size:14px;letter-spacing:.06em;line-height:1.25;color:var(--muted)}
.flap{left:0;right:0;top:138px;height:1px;background:rgba(30,45,70,.12);box-shadow:0 1px 0 rgba(255,255,255,.9)}

.seal{
  position:absolute;left:121px;top:108px;width:74px;height:74px;z-index:2;
  margin:0;padding:0;border:0;background:none;border-radius:50%;cursor:pointer;
  -webkit-tap-highlight-color:transparent;font:inherit;color:inherit;
}
.seal:focus{outline:none}
.seal:focus-visible{outline:2px solid var(--chev-blue);outline-offset:4px;border-radius:50%}
.seal img,.seal .half{position:absolute;inset:0;width:100%;height:100%}
.motion .seal.breathe img{animation:breathe 3s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.seal .half{background:url(assets/wax-seal.svg) center/100% 100% no-repeat}
.seal .half.top{clip-path:polygon(0 0,100% 0,100% 46%,70% 54%,40% 47%,0 55%)}
.seal .half.bot{clip-path:polygon(0 55%,40% 47%,70% 54%,100% 46%,100% 100%,0 100%)}

.hint{
  position:absolute;left:50%;top:calc(100% + 40px);transform:translateX(-50%);
  margin:0;white-space:nowrap;font-size:15px;font-style:italic;color:var(--muted);
  opacity:0;transition:opacity .6s ease;
}
.hint.on{opacity:1}

/* ---------- 6.2 Unfolded sheet ---------- */
#letter{display:none;padding-bottom:max(64px,calc(env(safe-area-inset-bottom) + 40px))}
#letter.shown{display:block}
.sheet-wrap{
  --sw:min(318px,calc(100vw - 72px));
  position:relative;width:var(--sw);height:calc(var(--sw) * 3 * .587);
  margin:calc(48px + env(safe-area-inset-top)) auto 72px;
  outline:none;
}
@media (min-width:900px){.sheet-wrap{--sw:420px}}
.sheet-tilt{width:100%;height:100%}
.sheet{
  position:absolute;left:0;top:0;width:318px;height:560.1px;
  transform-origin:0 0;transform:scale(var(--s));
  perspective:1200px;
}
.panel,.pshadow{position:absolute;left:0;width:318px;height:186.7px}
.p-top,.s-top{top:0;transform-origin:50% 100%}
.p-mid,.s-mid{top:186.7px}
.p-bot,.s-bot{top:373.4px;transform-origin:50% 0}
.pshadow{z-index:0;background:var(--paper);box-shadow:var(--shadow-paper-deep)}
.p-mid{z-index:1}.p-bot{z-index:2}.p-top{z-index:3}
.panel{-webkit-transform-style:preserve-3d;transform-style:preserve-3d}
.face{
  position:absolute;inset:0;background:var(--paper) var(--grain);
  -webkit-backface-visibility:hidden;backface-visibility:hidden;
}
.face.back{transform:rotateX(180deg)}
/* outside of the sheet: chevron border, as on the folded card */
.face.back::before{content:"";position:absolute;inset:0;background:var(--chevron)}
.face.back::after{content:"";position:absolute;inset:7px;background:var(--paper) var(--grain)}
.crease{position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(180deg,rgba(30,45,70,.08),rgba(255,255,255,.9))}
.dateline{position:absolute;left:24px;top:24px;font-size:13px;font-style:italic;line-height:1.3;color:var(--muted)}
.age{position:absolute;left:0;right:0;top:94px;font-size:96px;line-height:1;text-align:center;color:var(--red)}
.greeting{position:absolute;left:12px;right:12px;top:41.3px;font-size:27px;font-style:italic;line-height:1.3;text-align:center;color:var(--ink)}

/* ---------- 6.3 Reading ---------- */
.flow{display:flex;flex-direction:column;align-items:center}
.flow > * + *{margin-top:40px}
.page{
  --pw:min(338px,calc(100vw - 52px));
  position:relative;width:var(--pw);min-height:420px;
  padding:36px 28px 56px;
  background:var(--letter) var(--grain);box-shadow:var(--shadow-paper);
  transform:translateY(var(--ty,0px)) rotate(var(--r));
  font-size:16px;line-height:1.75;color:var(--ink);
  -webkit-hyphens:auto;hyphens:auto;overflow-wrap:break-word;
}
.page-1{--r:-.5deg}.page-2{--r:.6deg}.page-3{--r:-.3deg}
.page .salute{margin:0 0 12px;font-size:18px;font-style:italic}
.page .body p{margin:0 0 1em}
.page .sign{margin-top:32px}
.page .sign p{margin:0;font-style:italic}
.page .sign .off{font-size:16px}
.page .sign .name{font-size:20px}
.page .num{position:absolute;right:24px;bottom:16px;font-size:13px;line-height:1;color:var(--muted)}

.polaroid{
  --pol:min(236px,62vw);
  position:relative;width:var(--pol);margin-bottom:0;margin-left:0;margin-right:0;padding:12px 12px 0;background:var(--paper);box-shadow:var(--shadow-polaroid);
  transform:translateY(var(--ty,0px)) rotate(calc(var(--r) + var(--dr,0deg)));
}
.polaroid .img,.polaroid img{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:cover;background:var(--photo-ph)}
.polaroid .ph{display:flex;align-items:center;justify-content:center;font-size:15px;color:#4D5764}
.polaroid figcaption{height:52px;display:flex;align-items:center;justify-content:center;padding:0 6px;font-size:15px;font-style:italic;color:#3B4450;text-align:center;line-height:1.2;overflow:hidden}
.tape{position:absolute;top:-10px;left:50%;width:76px;height:20px;margin-left:-38px;background:var(--tape);opacity:.9;transform:rotate(var(--tr))}
/* phone placement: left / right offsets as fractions of a 390 px design */
.photo-1{--r:-4deg;--d0:-3deg;--tr:-3deg;align-self:flex-start;margin-left:12.3vw}
.photo-2{--r:3.5deg;--d0:3deg;--tr:4deg;align-self:flex-end;margin-right:10.8vw}
.photo-3{--r:-2.5deg;--d0:-3deg;--tr:2deg;align-self:flex-start;margin-left:15.4vw}
.photo-1 .tape{left:46%}.photo-2 .tape{left:54%}
.closing{align-self:flex-end;margin-right:22px;width:86px;height:auto;opacity:.8;transform:rotate(-12deg)}
.photo-3 + .closing{margin-top:48px}

@media (min-width:900px){
  .page{--pw:640px;min-height:560px;padding:60px 68px 72px;font-size:19px}
  .page .salute{font-size:22px}
  .page .sign .off{font-size:19px}
  .page .sign .name{font-size:24px}
  /* single 640 px column: photos sit inside the column's span */
  .photo-1{margin-left:calc(50vw - 320px + 40px)}
  .photo-2{margin-right:calc(50vw - 320px + 36px)}
  .photo-3{margin-left:calc(50vw - 320px + 70px)}
  .closing{margin-right:calc(50vw - 320px)}
}
@media (min-width:1100px){
  .flow{display:grid;grid-template-columns:1fr 640px 1fr;row-gap:40px;align-items:start}
  .flow > * + *{margin-top:0}
  .polaroid{--pol:min(268px,calc((100vw - 640px) / 2 - 64px))}
  .page-1{grid-row:1;grid-column:2}.photo-1{grid-row:1;grid-column:3}
  .page-2{grid-row:2;grid-column:2}.photo-2{grid-row:2;grid-column:1}
  .page-3{grid-row:3;grid-column:2}.photo-3{grid-row:3;grid-column:3}
  .polaroid{margin:80px 0 0;align-self:start}
  .photo-1,.photo-3{justify-self:start;margin-left:clamp(24px,calc((100vw - 640px) / 2 - var(--pol) - 40px),56px)}
  .photo-2{justify-self:end;margin-right:clamp(24px,calc((100vw - 640px) / 2 - var(--pol) - 40px),56px)}
  .photo-1{--r:5deg;--d0:3deg}.photo-2{--r:-4deg;--d0:-3deg}.photo-3{--r:-2.5deg;--d0:-3deg}
  .closing{grid-row:4;grid-column:2;justify-self:end;margin:8px 22px 0 0}
}

/* scroll reveal (motion only) */
.motion .reveal{opacity:0;--ty:24px;transition:opacity .5s var(--ease),transform .5s var(--ease)}
.motion .polaroid.reveal{--ty:28px;--dr:var(--d0);transition-duration:.55s}
.motion .polaroid.reveal .tape{opacity:0;transition:opacity .55s var(--ease) .12s}
.motion .reveal.in-view{opacity:1;--ty:0px;--dr:0deg}
.motion .polaroid.reveal.in-view .tape{opacity:.9}

@media (prefers-reduced-motion: reduce){
  .seal img{animation:none !important}
  .hint{transition:none}
}
</style>

<body>
<div class="scene" id="scene">
  <div class="card-pos" id="cardPos">
    <div class="card-drop" id="cardDrop">
      <div class="card-tilt" id="cardTilt">
        <div class="card" id="card">
          <div class="in">
            <div class="label" aria-hidden="true"><p>PAR AVION</p><p>BY AIR MAIL</p></div>
            <img class="stamp stamp-praha" src="assets/stamp-praha.svg" width="160" height="120" alt="Stamp with the Czech flag, Praha">
            <img class="stamp stamp-london" src="assets/stamp-london.svg" width="160" height="120" alt="Stamp with the Union flag, London">
            <img class="pm-london" src="assets/postmark-london.svg" width="240" height="120" alt="">
            <img class="pm-praha" src="assets/postmark-praha.svg" width="120" height="120" alt="">
            <p class="to-name" id="toName"></p>
            <p class="to-city">Praha</p>
            <div class="flap"></div>
          </div>
          <button class="seal breathe" id="seal" type="button" aria-label="Open the letter"><img src="assets/wax-seal.svg" width="200" height="200" alt=""></button>
        </div>
      </div>
    </div>
    <p class="hint" id="hint">Press the seal</p>
  </div>
</div>

<main id="letter">
  <section class="sheet-wrap" id="sheetWrap" tabindex="-1" aria-label="Birthday letter">
    <div class="sheet-tilt" id="sheetTilt">
      <div class="sheet" id="sheet">
        <div class="pshadow s-top"></div>
        <div class="pshadow s-mid"></div>
        <div class="pshadow s-bot"></div>
        <div class="panel p-mid">
          <div class="face front"><div class="crease"></div><p class="greeting" id="greeting"></p></div>
        </div>
        <div class="panel p-bot">
          <div class="face front"><div class="crease"></div></div>
          <div class="face back" aria-hidden="true"></div>
        </div>
        <div class="panel p-top">
          <div class="face front"><p class="dateline" id="dateline"></p><p class="age" id="age"></p></div>
          <div class="face back" aria-hidden="true"></div>
        </div>
      </div>
    </div>
  </section>
  <div class="flow" id="flow"></div>
</main>
<div class="sr" aria-live="polite" id="live"></div>

<script>
// ===== EDIT ONLY THIS BLOCK =====
const CONTENT = {
  name: "Mila",
  age: "23",
  dateline: "London, 5 November 2026",
  greeting: ["Happy Birthday,", "my beautiful girl <3"],
  pages: [
    "Mila my dearest, my wonderful, my pretty, my smart, my princess, my [insert adjective here], my most gorgeous girl, happy birthday. A very very VERY happy birthday in fact! I wish you all the best today and tomorrow and this month and all the years and months ahead we have together.",
    "I miss you every day. I miss you when I'm studying, I miss you when we don't call, and I miss you when I'm cooking.",
    "I love you, I love you, and I love you. When you say it three times, it has a special effect, right?"
  ],                     // blank line (\n\n) = new paragraph
  signoff: "With all my love,",
  signature: "Galih <3",
  photos: [
    { src: "photos/photo-1.jpg", alt: "First photo together", caption: "Do you remember this pic? I think it was one of the first ones of us together" },
    { src: "photos/photo-2.jpg", alt: "Mirror kiss photo", caption: "Heehee" },
    { src: "photos/photo-3.jpg", alt: "Screenshot of my lock screen", caption: "Beautiful girl deserves to be on my lock screen" }
  ]
};
// ================================

(function () {
  "use strict";
  var doc = document, root = doc.documentElement;
  var motion = root.classList.contains("motion");
  var $ = function (id) { return doc.getElementById(id); };
  function el(tag, cls, text) {
    var n = doc.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  /* ---------- content ---------- */
  $("toName").textContent = CONTENT.name;
  $("dateline").textContent = CONTENT.dateline;
  $("age").textContent = CONTENT.age;
  var g = $("greeting");
  CONTENT.greeting.forEach(function (line, i) {
    if (i) g.appendChild(doc.createElement("br"));
    g.appendChild(doc.createTextNode(line));
  });

  function paragraphs(text, into) {
    String(text).split(/\n\s*\n/).forEach(function (para) {
      var p = el("p");
      para.split("\n").forEach(function (line, i) {
        if (i) p.appendChild(doc.createElement("br"));
        p.appendChild(doc.createTextNode(line));
      });
      into.appendChild(p);
    });
  }

  var flow = $("flow"), total = CONTENT.pages.length;
  CONTENT.pages.forEach(function (text, i) {
    var page = el("article", "page reveal page-" + (i + 1));
    page.setAttribute("lang", "en");
    if (i === 0) page.appendChild(el("p", "salute", CONTENT.name + ","));
    var body = el("div", "body");
    paragraphs(text, body);
    page.appendChild(body);
    if (i === total - 1) {
      var sign = el("div", "sign");
      sign.appendChild(el("p", "off", CONTENT.signoff));
      sign.appendChild(el("p", "name", CONTENT.signature));
      page.appendChild(sign);
    }
    var num = el("p", "num", (i + 1) + " / " + total);
    page.appendChild(num);
    flow.appendChild(page);

    var ph = CONTENT.photos[i];
    if (!ph) return;
    var pol = el("figure", "polaroid reveal photo-" + (i + 1));
    var tape = el("div", "tape");
    tape.setAttribute("aria-hidden", "true");
    var img = el("img", "img");
    img.alt = ph.alt || "";
    img.loading = "lazy";
    img.decoding = "async";
    img.width = 1000; img.height = 1000;
    img.onerror = function () {
      var box = el("div", "img ph", "Photo " + (i + 1));
      box.setAttribute("role", "img");
      box.setAttribute("aria-label", ph.alt || ("Photo " + (i + 1)));
      if (img.parentNode) img.parentNode.replaceChild(box, img);
    };
    img.src = ph.src;
    pol.appendChild(tape);
    pol.appendChild(img);
    pol.appendChild(el("figcaption", null, ph.caption || ""));
    flow.appendChild(pol);
  });
  var closing = el("img", "closing");
  closing.src = "assets/postmark-praha.svg";
  closing.width = 120; closing.height = 120;
  closing.alt = "Postmark: Praha, 5 November 2026";
  flow.appendChild(closing);

  /* ---------- scaling ---------- */
  var cardPos = $("cardPos"), sheetWrap = $("sheetWrap");
  function rescale() {
    if (cardPos.offsetWidth) root.style.setProperty("--k", cardPos.offsetWidth / 316);
    if (sheetWrap.offsetWidth) root.style.setProperty("--s", sheetWrap.offsetWidth / 318);
  }
  rescale();
  addEventListener("resize", rescale);

  /* ---------- arrival ---------- */
  var cardDrop = $("cardDrop"), hint = $("hint"), seal = $("seal");
  var arrived = false;
  function arrive() {
    if (arrived) return;
    arrived = true;
    if (motion && cardDrop.animate) {
      cardDrop.animate(
        [{ transform: "translateY(-24px)", opacity: 0 }, { transform: "none", opacity: 1 }],
        { duration: 600, easing: "cubic-bezier(.2,.8,.2,1)" }
      );
    }
    cardDrop.style.opacity = "1";
    hintTimer = setTimeout(function () { hint.classList.add("on"); }, 1200);
  }
  var hintTimer;
  var ready = [doc.fonts ? doc.fonts.ready : Promise.resolve()];
  Array.prototype.forEach.call(doc.querySelectorAll("#card img"), function (im) {
    ready.push(im.decode ? im.decode().catch(function () {}) : Promise.resolve());
  });
  Promise.all(ready).then(arrive, arrive);
  setTimeout(arrive, 1500);

  /* ---------- opening ---------- */
  var opened = false;
  seal.addEventListener("click", open);

  function anim(node, frames, opts) {
    if (!node.animate) return null;
    opts.fill = opts.fill || "backwards";
    return node.animate(frames, opts);
  }

  function open() {
    if (opened) return;
    opened = true;
    arrive();
    clearTimeout(hintTimer);
    seal.disabled = true;
    seal.classList.remove("breathe");
    seal.setAttribute("aria-hidden", "true");

    var letter = $("letter"), scene = $("scene");
    letter.classList.add("shown");
    rescale();

    if (!motion || !doc.body.animate) return openReduced(letter, scene);

    var cardRect = cardPos.getBoundingClientRect();
    var wrapRect = sheetWrap.getBoundingClientRect();
    var dy = (cardRect.top + cardRect.height / 2) - (wrapRect.top + wrapRect.height / 2);
    var m = cardRect.width / wrapRect.width;
    var unfoldEase = "cubic-bezier(.3,.7,.2,1)";

    // 0–600: seal cracks, halves fall
    var sealImg = seal.querySelector("img");
    sealImg.style.visibility = "hidden";
    var top = el("span", "half top"), bot = el("span", "half bot");
    seal.appendChild(top); seal.appendChild(bot);
    anim(top, [
      { transform: "translate(0,0) rotate(0deg)", opacity: 1 },
      { transform: "translate(-3px,-4px) rotate(-6deg)", opacity: 1, offset: .25 },
      { transform: "translate(-6px,26px) rotate(-26deg)", opacity: 0 }
    ], { duration: 600, easing: "ease-in", fill: "forwards" });
    anim(bot, [
      { transform: "translate(0,0) rotate(0deg)", opacity: 1 },
      { transform: "translate(3px,4px) rotate(6deg)", opacity: 1, offset: .25 },
      { transform: "translate(6px,34px) rotate(26deg)", opacity: 0 }
    ], { duration: 600, easing: "ease-in", fill: "forwards" });

    // 150–600: hint fades
    anim(hint, [{ opacity: getComputedStyle(hint).opacity }, { opacity: 0 }],
      { delay: 150, duration: 450, fill: "forwards" });

    // 150–750: folded card out, sheet (folded) in
    anim($("cardTilt"), [
      { transform: "rotate(-1deg) scale(1)", opacity: 1 },
      { transform: "rotate(-1deg) scale(.96)", opacity: 0 }
    ], { delay: 150, duration: 600, easing: "ease-in-out", fill: "both" });
    anim(sheetWrap, [
      { transform: "translateY(" + dy + "px) scale(" + m + ")", opacity: 0 },
      { transform: "translateY(" + dy + "px) scale(" + m + ")", opacity: 1, offset: .4 },
      { transform: "translateY(0) scale(1)", opacity: 1 }
    ], { delay: 150, duration: 1500, easing: "ease-in-out" });
    anim($("sheetTilt"), [{ transform: "rotate(-1deg)" }, { transform: "rotate(-1deg)", offset: .79 }, { transform: "rotate(0deg)" }],
      { delay: 150, duration: 1900, easing: "ease-in-out" });

    // 750–1250: bottom panel; 1150–1650: top panel
    var q = function (s) { return sheetWrap.querySelector(s); };
    [[".p-bot", 180, 750], [".s-bot", 180, 750], [".p-top", -180, 1150], [".s-top", -180, 1150]].forEach(function (a) {
      var isShadow = a[0].indexOf(".s-") === 0;
      var from = { transform: "rotateX(" + a[1] + "deg)" }, to = { transform: "rotateX(0deg)" };
      if (isShadow) { from.opacity = 0; to.opacity = 1; }
      anim(q(a[0]), [from, to], { delay: a[2], duration: 500, easing: unfoldEase });
    });

    // 1650–2050: settle, shadow deepens
    Array.prototype.forEach.call(sheetWrap.querySelectorAll(".pshadow"), function (s) {
      anim(s, [{ boxShadow: "0 1px 1px rgba(30,45,70,.06),0 16px 34px rgba(30,45,70,.15)" },
               { boxShadow: "0 2px 2px rgba(30,45,70,.07),0 22px 46px rgba(30,45,70,.19)" }],
        { delay: 1650, duration: 400, easing: "ease-out" });
    });

    setTimeout(function () { scene.parentNode && scene.parentNode.removeChild(scene); }, 800);
    setTimeout(confetti, 1300);
    setTimeout(finish, 2050);
  }

  function openReduced(letter, scene) {
    if (scene.animate) {
      scene.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, fill: "forwards" });
      sheetWrap.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200 });
    }
    setTimeout(function () {
      scene.parentNode && scene.parentNode.removeChild(scene);
      finish();
    }, 200);
  }

  function finish() {
    root.classList.remove("locked");
    try { sheetWrap.focus({ preventScroll: true }); } catch (e) { sheetWrap.focus(); }
    $("live").textContent = "Letter opened.";
    if (motion) startReveal();
  }

  /* ---------- scroll reveal ---------- */
  function startReveal() {
    var items = Array.prototype.slice.call(doc.querySelectorAll(".reveal"));
    if (!("IntersectionObserver" in window)) {
      items.forEach(function (n) { n.classList.add("in-view"); });
      return;
    }
    var io = new IntersectionObserver(function (entries) {
      var hits = entries.filter(function (e) { return e.isIntersecting; }).map(function (e) { return e.target; });
      hits.sort(function (a, b) { return items.indexOf(a) - items.indexOf(b); });
      hits.forEach(function (n, i) {
        io.unobserve(n);
        setTimeout(function () { n.classList.add("in-view"); }, i * 120);
      });
    }, { threshold: 0.15, rootMargin: "0px 0px -8% 0px" });
    items.forEach(function (n) { io.observe(n); });
  }

  /* ---------- confetti ---------- */
  function confetti() {
    if (!motion) return;
    var rect = sheetWrap.getBoundingClientRect();
    var cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
    var cv = el("canvas");
    cv.setAttribute("aria-hidden", "true");
    cv.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10";
    doc.body.appendChild(cv);
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    var W = innerWidth, H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    var ctx = cv.getContext("2d");
    var colours = ["#B8323A", "#24487A", "#FFFFFF", "#6F93C2"];
    var n = (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4) ? 90 : 140;
    var R = Math.PI / 180, parts = [];
    for (var i = 0; i < n; i++) {
      var ang = (-90 + (Math.random() * 140 - 70)) * R;
      var sp = 7 + Math.random() * 6;
      var circle = Math.random() < .22;
      parts.push({
        x: cx, y: cy, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
        c: colours[i % 4], circle: circle,
        w: circle ? 8 : 5 + Math.random() * 4, h: circle ? 8 : 10 + Math.random() * 7,
        rot: Math.random() * 360 * R, vr: (Math.random() * 24 - 12) * R,
        ph: Math.random() * Math.PI * 2, fq: .08 + Math.random() * .08, amp: .6 + Math.random() * 1.2,
        tilt: Math.random() * Math.PI * 2, vt: .1 + Math.random() * .15,
        dead: false
      });
    }
    var start = performance.now(), last = start, frame = 0;
    function tick(now) {
      var f = Math.min((now - last) / (1000 / 60), 3); // frames elapsed at 60 fps
      last = now; frame += f;
      var age = now - start;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, cv.width, cv.height);
      var alive = 0, drag = Math.pow(.985, f);
      for (var i = 0; i < parts.length; i++) {
        var p = parts[i];
        if (p.dead) continue;
        p.vx *= drag; p.vy = p.vy * drag + .28 * f;
        p.x += (p.vx + Math.cos(frame * p.fq + p.ph) * p.amp) * f;
        p.y += p.vy * f;
        p.rot += p.vr * f; p.tilt += p.vt * f;
        if (p.y > H + 30 || p.x < -40 || p.x > W + 40 || age > 3500) { p.dead = true; continue; }
        alive++;
        var cs = Math.cos(p.rot) * dpr, sn = Math.sin(p.rot) * dpr;
        ctx.setTransform(cs, sn, -sn, cs, p.x * dpr, p.y * dpr);
        ctx.fillStyle = p.c;
        if (p.circle) {
          ctx.beginPath(); ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2); ctx.fill();
          if (p.c === "#FFFFFF") { ctx.lineWidth = 1; ctx.strokeStyle = "rgba(30,45,70,.15)"; ctx.stroke(); }
        } else {
          var h = p.h * Math.abs(Math.cos(p.tilt)) + 1;
          ctx.fillRect(-p.w / 2, -h / 2, p.w, h);
          if (p.c === "#FFFFFF") { ctx.lineWidth = 1; ctx.strokeStyle = "rgba(30,45,70,.15)"; ctx.strokeRect(-p.w / 2, -h / 2, p.w, h); }
        }
      }
      if (alive) requestAnimationFrame(tick);
      else cv.parentNode && cv.parentNode.removeChild(cv);
    }
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
