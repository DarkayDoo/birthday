<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120">
  <defs>
    <mask id="perf" maskUnits="userSpaceOnUse" x="0" y="0" width="160" height="120">
      <rect x="0" y="0" width="160" height="120" fill="#fff"/>
      <rect x="0" y="0" width="160" height="120" fill="none" stroke="#000" stroke-width="6.5" stroke-dasharray="0 10" stroke-linecap="round"/>
    </mask>
    <clipPath id="flagbox"><rect x="0" y="0" width="50" height="30"/></clipPath>
    <clipPath id="tri"><path d="M25,15 h25 v15 z v15 h-25 z h-25 v-15 z v-15 h25 z"/></clipPath>
    <filter id="wear" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.25" numOctaves="2" seed="11" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.957  0 0 0 0 0.937  0 0 0 0 0.894  0 0 0 -16 5.2"/>
    </filter>
  </defs>
  <g mask="url(#perf)">
    <rect x="0" y="0" width="160" height="120" fill="#F5F1E6"/>
    <svg x="12" y="12" width="136" height="80" viewBox="0 0 50 30" preserveAspectRatio="none">
      <g clip-path="url(#flagbox)">
        <rect x="0" y="0" width="50" height="30" fill="#1F3462"/>
        <path d="M0,0 L50,30 M50,0 L0,30" stroke="#F5F1E6" stroke-width="6"/>
        <path d="M0,0 L50,30 M50,0 L0,30" clip-path="url(#tri)" stroke="#A8303A" stroke-width="4"/>
        <path d="M25,0 v30 M0,15 h50" stroke="#F5F1E6" stroke-width="10"/>
        <path d="M25,0 v30 M0,15 h50" stroke="#A8303A" stroke-width="6"/>
      </g>
    </svg>
    <rect x="12" y="12" width="136" height="80" filter="url(#wear)"/>
    <text x="12" y="108" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" letter-spacing="2.4" fill="#1F3462">LONDON</text>
    <text x="148" y="108" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" letter-spacing="1" fill="#1F3462">2026</text>
  </g>
</svg>
