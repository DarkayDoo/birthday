      <line x1="10" y1="70" x2="110" y2="70" stroke-width="1.4"/>
    </g>
    <g fill="#3A3550" fill-opacity="0.8" font-family="Helvetica, Arial, sans-serif" font-weight="700">
      <text font-size="12" letter-spacing="3.5"><textPath href="#pTop" xlink:href="#pTop" startOffset="50%" text-anchor="middle">PRAHA 1</textPath></text>
      <text font-size="7.5" letter-spacing="2" dy="6"><textPath href="#pBot" xlink:href="#pBot" startOffset="50%" text-anchor="middle">ČESKÁ REPUBLIKA</textPath></text>
      <text x="60" y="64" font-size="11" text-anchor="middle" letter-spacing="1">05.11.26</text>
    </g>
