<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120">
  <defs>
    <mask id="perf" maskUnits="userSpaceOnUse" x="0" y="0" width="160" height="120">
      <rect x="0" y="0" width="160" height="120" fill="#fff"/>
      <rect x="0" y="0" width="160" height="120" fill="none" stroke="#000" stroke-width="6.5" stroke-dasharray="0 10" stroke-linecap="round"/>
    </mask>
    <filter id="wear" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.25" numOctaves="2" seed="4" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.965  0 0 0 0 0.949  0 0 0 0 0.914  0 0 0 -16 5.2"/>
    </filter>
  </defs>
  <g mask="url(#perf)">
    <rect x="0" y="0" width="160" height="120" fill="#F6F2EA"/>
    <svg x="12" y="12" width="136" height="80" viewBox="0 0 45 30" preserveAspectRatio="none">
      <rect x="0" y="0" width="45" height="15" fill="#F6F2EA"/>
      <rect x="0" y="15" width="45" height="15" fill="#B8323A"/>
      <path d="M0,0 L22.5,15 L0,30 Z" fill="#24487A"/>
    </svg>
    <rect x="12" y="12" width="136" height="80" fill="none" stroke="#24487A" stroke-opacity="0.25" stroke-width="0.6"/>
    <rect x="12" y="12" width="136" height="80" filter="url(#wear)"/>
    <text x="12" y="108" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" letter-spacing="2.4" fill="#24487A">PRAHA</text>
    <text x="148" y="108" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" letter-spacing="1" fill="#24487A">2026</text>
  </g>
</svg>
